# obrateatral — SERVER on Render (FREE tier), front on Netlify.
#
# This service is API + Socket.IO only. The SPA is built and served by Netlify
# (see netlify.toml), which also proxies /api here so the session cookie stays
# first-party. The WebSocket connects directly and authenticates with a 5-minute
# token (/api/auth/socket-token).
#
# The database lives OUTSIDE Render: Supabase Postgres (its free tier does not expire,
# unlike Render's free Postgres, which is deleted after 90 days).
#
# How the free tier behaves, honestly:
#   - The service sleeps after ~15 min without inbound traffic; the next request
#     pays a ~30-50 s cold start.
#   - The client keep-alive (GET /health every 5 min while a tab is open) keeps it
#     awake during a session, so a 4-hour watch is not interrupted.
#   - 512 MB RAM: plenty for two people on Express + Socket.IO.
#
# Before you deploy:
#   1. Supabase: copy the connection string into DATABASE_URL in the Render
#      dashboard (Environment). Use the SESSION POOLER host (port 5432), not the
#      transaction pooler (6543): Prisma migrations need a session connection.
#      Adding `?connection_limit=5` is a good idea on a free project.
#   2. SESSION_SECRET: `openssl rand -hex 32`. Never commit the value.
#   2b. NODE_ENV=production makes `npm ci` skip devDependencies, which is why the
#       build command passes --include=dev (Prisma CLI) and `tsx` lives in
#       dependencies (the start command runs TypeScript directly).
#   3. SEED_USERS: "mauro:<clave>,teff:<clave>". It only CREATES missing users;
#      it never overwrites a password changed from /cuenta.
#   4. CLIENT_URL: the Netlify URL (e.g. https://obrateatral.netlify.app). It drives
#      CORS for the WebSocket handshake. Comma-separate extra origins if needed.
#   5. LINK_KEY: AES-256-GCM key for the studio link at rest. Render generates one
#      on first deploy. If you ever point another environment at the same database,
#      reuse the SAME value or previously saved links cannot be decrypted.

services:
  - type: web
    name: obrateatral
    runtime: node
    plan: free
    buildCommand: |
      cd server && npm ci --include=dev && npx prisma generate && npx prisma migrate deploy
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SEED_USERS
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: LINK_KEY
        generateValue: true
